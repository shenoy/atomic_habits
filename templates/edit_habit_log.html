{% extends 'base.html' %}
{% block title %}Edit entry · {{ habit.name }}{% endblock %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<a class="crumb" href="{{ url_for('track_habit', habit_id=habit.id) }}">← {{ habit.name }}</a>
<h1 style="margin-bottom:22px">Edit entry</h1>
<form method="post" class="panel" style="display:grid; gap:14px">
  <label class="field">Note<textarea name="activity_name" rows="2" required>{{ log.activity_name }}</textarea></label>
  <div class="row">
    <label class="field">{{ 'Delay in minutes (negative = early)' if habit.is_delay else 'Amount (' ~ habit.unit|trim ~ ')' }}
      <input name="value" inputmode="decimal" value="{{ log.value|num }}" required></label>
    <label class="field">Date<input type="date" name="date" value="{{ log.date_created.strftime('%Y-%m-%d') }}" required></label>
    <label class="field">Time logged<input type="time" name="time" value="{{ log.time_created }}"></label>
  </div>
  <div style="display:flex; gap:10px; justify-content:flex-end">
    <a class="btn" href="{{ url_for('track_habit', habit_id=habit.id) }}">Cancel</a>
    <button class="btn primary" type="submit">Save changes</button>
  </div>
</form>
{% endblock %}
