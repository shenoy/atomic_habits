<!DOCTYPE html>
<html>
<head>
    <title>Edit Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0 auto; padding: 20px; max-width: 900px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px 0; width: 100%; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Tracker: {{ habit.name }}</h2>
        <form method="POST">
            <label>Tracker Name:</label>
            <input type="text" name="name" value="{{ habit.name }}" required>
            
            <label>Daily Goal:</label>
            <input type="number" name="goal" value="{{ habit.goal }}" required>
            
            <label>Unit (e.g., mins, pages):</label>
            <input type="text" name="unit" value="{{ habit.unit }}" required>
            
            <button type="submit">Save Changes</button>
        </form>
        <br>
        <a href="/" style="text-decoration: none; color: #666;">⬅ Cancel and Go Back</a>
    </div>
</body>
</html>
